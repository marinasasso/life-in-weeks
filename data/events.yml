"1964-09-07":
    - headline: "🐣 I was born"
      description: "At the Queen of Angels Hospital in Los Angeles. It was a Catholic Hospital and mom had to argue with the nuns about my last name. They told her she couldn't give me my father's name unless they were married. Mom knew her rights and insisted, and the birth certificate did finally say Marina Louise Bukowski. They took me away from mom right after I was born and put me in the nursery. Mom was surprised by this, by then, old fashioned practice. My four half-sisters had been born back east where they new the baby and mother need to be together as much as possible after birth. My father first saw me through the window, crying and red-faced."
      based: "East Hollywood"


"1965-12-01":
    - headline: "Mom moved out"
      description: "Moved to a nearby apartment at 5526 Carlton Way, walking distance from Poppa Hank's apartment on De Longpre."
      based: "East Hollywood"

"1968-06-01":
    - headline: "Lower Farm commune in New Mexico"
      description: "There were quite a few communes near Placitas:  We lived in Lower Farm, run by a guy known by various names, including Ulysseys S Grant, and Vulcan."
      based: "Placitas"

"1969-09-01":
    - headline: "🖍️ Kindergarten, Part 1"
      description: "I first went to Kindergarten in Garden Grove because we were living at my grandmother's house. I was *not* shy yet, and I remember getting in trouble for talking too much and thinking that the (substitute) teacher was the problem, not me."
      based: "Garden Grove"
      doing: "Kindergartner"

"1999-12-31":
    - headline: "💥 Y2K"
      description: "We survived!"

"2001-09-11":
    - headline: "💔 9/11"
      description: "A strange and frightening day."

